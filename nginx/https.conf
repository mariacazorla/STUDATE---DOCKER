# El server de nginx para servir Studate por HTTPS. Se monta encima del default.conf de la imagen de la
# web (ver compose.https.yml) junto con el certificado, así la imagen es la misma con y sin HTTPS.
#
#   - En el 80 solo hay una redirección: cualquier petición por http pasa a https.
#   - En el 443 está la web, con las mismas reglas que por http (studate-app.conf, que va dentro de la
#     imagen): la web, las rutas de la SPA y el proxy de /api y /socket.io.
#
# El certificado y su clave se leen de /etc/nginx/certs, que el compose monta desde la carpeta certs/
# de este repo (no se sube a git). Vale un certificado autofirmado (el navegador avisa una vez) o uno
# de verdad si el servidor tiene nombre de dominio. Cómo se generan, en el README.

# La redirección supone los puertos normales (80 y 443): $host no lleva el puerto. Si en una prueba
# local se usan otros (WEB_PORT_HTTPS=8443), hay que abrir https://...:8443 a mano
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/studate.crt;
    ssl_certificate_key /etc/nginx/certs/studate.key;

    # Solo las versiones de TLS que se consideran seguras hoy
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/studate-app.conf;
}
